# Allow these native packages to run their install/build scripts.
# pnpm 11 renamed `onlyBuiltDependencies` (a list) to `allowBuilds` (a map).
# Both keys are kept so this works on pnpm 10.x and 11.x — pnpm ignores
# whichever key it doesn't recognize.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - sharp
