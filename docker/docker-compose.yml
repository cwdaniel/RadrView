name: radrview

services:
  ingest-mrms:
    container_name: radrview-ingest-mrms
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["node", "dist/ingest/mrms.js"]
    volumes:
      - radrview-data:/data
    environment:
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
      - LOG_LEVEL=info
      - POLL_INTERVAL_MS=30000
      - MRMS_REGION=conus
    restart: unless-stopped
    depends_on:
      - redis

  ingest-mrms-alaska:
    container_name: radrview-ingest-alaska
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["node", "dist/ingest/mrms.js"]
    volumes:
      - radrview-data:/data
    environment:
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
      - LOG_LEVEL=info
      - MRMS_REGION=alaska
    restart: unless-stopped
    depends_on:
      - redis

  ingest-mrms-hawaii:
    container_name: radrview-ingest-hawaii
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["node", "dist/ingest/mrms.js"]
    volumes:
      - radrview-data:/data
    environment:
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
      - LOG_LEVEL=info
      - MRMS_REGION=hawaii
    restart: unless-stopped
    depends_on:
      - redis

  ingest-mrms-type:
    container_name: radrview-ingest-mrms-type
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["node", "dist/ingest/mrms.js"]
    volumes:
      - radrview-data:/data
    environment:
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
      - LOG_LEVEL=info
      - MRMS_REGION=conus
      - MRMS_PRODUCT=type
    restart: unless-stopped
    depends_on:
      - redis

  ingest-mrms-alaska-type:
    container_name: radrview-ingest-mrms-alaska-type
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["node", "dist/ingest/mrms.js"]
    volumes:
      - radrview-data:/data
    environment:
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
      - LOG_LEVEL=info
      - MRMS_REGION=alaska
      - MRMS_PRODUCT=type
    restart: unless-stopped
    depends_on:
      - redis

  ingest-mrms-hawaii-type:
    container_name: radrview-ingest-mrms-hawaii-type
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["node", "dist/ingest/mrms.js"]
    volumes:
      - radrview-data:/data
    environment:
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
      - LOG_LEVEL=info
      - MRMS_REGION=hawaii
      - MRMS_PRODUCT=type
    restart: unless-stopped
    depends_on:
      - redis

  tiler-1:
    container_name: radrview-tiler-1
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["node", "dist/pipeline/tiler.js"]
    volumes:
      - radrview-data:/data
    environment:
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
      - ZOOM_MIN=2
      - ZOOM_MAX=7
      - LOG_LEVEL=info
    restart: unless-stopped
    depends_on:
      - redis

  tiler-2:
    container_name: radrview-tiler-2
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["node", "dist/pipeline/tiler.js"]
    volumes:
      - radrview-data:/data
    environment:
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
      - ZOOM_MIN=2
      - ZOOM_MAX=7
      - LOG_LEVEL=info
    restart: unless-stopped
    depends_on:
      - redis

  server:
    container_name: radrview-server
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["node", "dist/server/index.js"]
    ports:
      - "8600:8600"
    volumes:
      - radrview-data:/data
      # Self-hosted basemap (BASEMAP=pmtiles): copy the archive into the data
      # volume, e.g. `docker cp basemap.pmtiles radrview-server:/data/`, or
      # mount a read-only file produced by scripts/download-basemap.sh:
      # - ./basemap.pmtiles:/data/basemap.pmtiles:ro
      # - ./basemap-assets:/data/basemap-assets:ro
    environment:
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
      - PORT=8600
      - LOG_LEVEL=info
      - NEXRAD_ENABLED=true
      - NEXRAD_STATIONS=all
      - NEXRAD_ZOOM_MIN=8
      # Basemap: openfreemap (default, keyless) | pmtiles (self-hosted) | custom
      - BASEMAP=openfreemap
      # - BASEMAP_PMTILES_PATH=/data/basemap.pmtiles
      # - BASEMAP_ASSETS_DIR=/data/basemap-assets
      # - BASEMAP_STYLE_URL=https://example.com/style.json
    restart: unless-stopped
    depends_on:
      - redis

  ingest-dwd:
    container_name: radrview-ingest-dwd
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["node", "dist/ingest/dwd.js"]
    volumes:
      - radrview-data:/data
    environment:
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
      - LOG_LEVEL=info
    restart: unless-stopped
    depends_on:
      - redis

  cleanup:
    container_name: radrview-cleanup
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["node", "dist/pipeline/cleanup.js"]
    volumes:
      - radrview-data:/data
    environment:
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
      - RETENTION_HOURS=24
      - LOG_LEVEL=info
    restart: unless-stopped
    depends_on:
      - redis

  ingest-canada:
    container_name: radrview-ingest-canada
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["node", "dist/ingest/ec.js"]
    volumes:
      - radrview-data:/data
    environment:
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
      - LOG_LEVEL=info
    restart: unless-stopped
    depends_on:
      - redis

  compositor:
    container_name: radrview-compositor
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["node", "dist/pipeline/compositor.js"]
    volumes:
      - radrview-data:/data
    environment:
      - REDIS_URL=redis://redis:6379
      - DATA_DIR=/data
      - ZOOM_MIN=2
      - ZOOM_MAX=7
      - LOG_LEVEL=info
    restart: unless-stopped
    depends_on:
      - redis

  ingest-nexrad:
    container_name: radrview-ingest-nexrad
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["node", "dist/nexrad/main.js"]
    environment:
      - REDIS_URL=redis://redis:6379
      - NEXRAD_STATIONS=all
      - LOG_LEVEL=info
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    container_name: radrview-redis
    image: redis:7-alpine
    # Not published to the host: every service reaches it on the compose
    # network at redis://redis:6379, and the image runs without a password.
    # For local development against processes running on the host, add a
    # loopback-only mapping in an override file (see docs/configuration.md):
    #   ports:
    #     - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    restart: unless-stopped

volumes:
  radrview-data:
    driver: local
  redis-data:
    driver: local
